name: Carousel window prices

# Separate price sweep for the carousel's break windows (holiday bridges across all regions +
# ordinary Fri→Sun weekends, 6-month horizon), collecting BOTH flight variants (direct + any) on
# each window's exact dates. Writes public.window_prices — NOT offers — so it never collides with
# the main collector's data or its prune. Logic: scripts/fetch-window-prices.mjs.
#
# SCHEDULED twice a day at stable Europe/Berlin times plus manual workflow_dispatch (kept for
# supervised / ad-hoc runs).
#
# The sweep is split into 20 PARTS, one per home airport. The parts run STRICTLY SEQUENTIALLY
# (max-parallel: 1) so they never double the request rate against the partner, and fail-fast: false
# means a part that fails does NOT cancel the others. Each part flushes fares per destination and
# writes a window_price_progress marker, so a crash loses at most the current destination.
#
# ONE planning date (plan-date job) is pinned for the whole run and passed to every part as
# PLAN_DATE — the run crosses midnight, so without this the parts would plan different window sets.
# After the matrix, a single catch-up pass re-runs the same airports with the SAME PLAN_DATE:
# already-collected destinations are skipped via window_price_progress, so only the tail (parts that
# hit the timeout) is re-collected. One catch-up pass, not a loop.
on:
  schedule:
    # Avoid :00 — scheduled Actions are most delayed at the start of an hour.
    - cron: '7 3 * * *'
      timezone: 'Europe/Berlin'
    - cron: '7 15 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch: # keep manual runs too (supervised / ad-hoc), alongside the schedule above
    inputs:
      airport:
        description: 'One home-airport IATA to collect, or "all" / blank for every airport'
        required: false
        default: 'MUC'
      full_sweep:
        description: 'Destination plan: auto = top 50 + daily 1/7 tail · on = force full · off = top only'
        required: false
        type: choice
        default: 'auto'
        options: [auto, 'on', 'off']
      top_dests:
        description: 'Destinations per airport in narrow mode (blank = default 50)'
        required: false
        default: ''

# A new carousel run supersedes an older carousel run. Night maintenance checks both this workflow
# and the main collector before doing any work.
concurrency:
  group: window-prices
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pin ONE planning date for the whole run. The 20 parts run sequentially and the run crosses
  # midnight, so without a shared date each part would call berlinToday() at its own start and plan
  # a different window set. Every part of BOTH passes receives this exact date via PLAN_DATE.
  plan-date:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.pick.outputs.date }}
    steps:
      - id: pick
        name: Pick the Europe/Berlin calendar day
        run: echo "date=$(TZ=Europe/Berlin date +%F)" >> "$GITHUB_OUTPUT"

  sweep:
    # First pass. One part per home airport. Airports mirror origin_regions.airport (20 codes); the
    # script aborts if ORIGIN is not a known home airport, so a stale code fails loudly.
    needs: plan-date
    strategy:
      fail-fast: false   # one airport failing must not cancel the rest
      max-parallel: 1    # strictly sequential — never two parts at once (shared partner rate limit)
      matrix:
        airport: ${{ (github.event.inputs.airport == '' || github.event.inputs.airport == 'all') && fromJSON('["BER","FRA","VIE","DUS","HAM","GVA","HHN","MUC","CGN","STR","ZRH","BTS","EIN","BSL","NRN","NUE","LEJ","FMM","DRS","SZG"]') || fromJSON(format('["{0}"]', github.event.inputs.airport)) }}
    name: Window prices — ${{ matrix.airport }}
    runs-on: ubuntu-latest
    timeout-minutes: 150  # headroom for a full catalogue on a slow partner day (90 left only ~17 min slack)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect window prices for ${{ matrix.airport }}
        # TP_TOKEN + service-role key are the same secrets the main collector uses; SUPABASE_URL is
        # public, passed alongside with the current default. PLAN_DATE pins the window set for the run.
        env:
          ORIGIN: ${{ matrix.airport }}
          PLAN_DATE: ${{ needs.plan-date.outputs.date }}
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xpalogebawoljlafsafs.supabase.co' }}
          # on/off force full/top-only; auto checks the top destinations plus today's weekly tail.
          FULL_SWEEP: ${{ github.event.inputs.full_sweep == 'on' && '1' || github.event.inputs.full_sweep == 'off' && '0' || '' }}
          TOP_DESTS: ${{ github.event.inputs.top_dests }}
        run: node scripts/fetch-window-prices.mjs

  catch-up:
    # Second and FINAL pass (not a loop). Same airports, SAME PLAN_DATE — destinations already
    # collected in the first pass are skipped via window_price_progress, so only the tail (parts that
    # hit the 90-min cap) is re-collected. Runs even if some first-pass parts failed (!cancelled()),
    # as long as the planning date was pinned.
    needs: [plan-date, sweep]
    if: ${{ !cancelled() && needs['plan-date'].result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        airport: ${{ (github.event.inputs.airport == '' || github.event.inputs.airport == 'all') && fromJSON('["BER","FRA","VIE","DUS","HAM","GVA","HHN","MUC","CGN","STR","ZRH","BTS","EIN","BSL","NRN","NUE","LEJ","FMM","DRS","SZG"]') || fromJSON(format('["{0}"]', github.event.inputs.airport)) }}
    name: Window prices (catch-up) — ${{ matrix.airport }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect window prices for ${{ matrix.airport }}
        env:
          ORIGIN: ${{ matrix.airport }}
          PLAN_DATE: ${{ needs.plan-date.outputs.date }}
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xpalogebawoljlafsafs.supabase.co' }}
          # on/off force full/top-only; auto checks the top destinations plus today's weekly tail.
          FULL_SWEEP: ${{ github.event.inputs.full_sweep == 'on' && '1' || github.event.inputs.full_sweep == 'off' && '0' || '' }}
          TOP_DESTS: ${{ github.event.inputs.top_dests }}
        run: node scripts/fetch-window-prices.mjs

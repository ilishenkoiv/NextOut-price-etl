name: Daily cheapest offers snapshot

on:
  schedule:
    # Priority-0 price-only recheck. It never rebuilds or re-ranks the immutable roulette pool.
    # An idle gate and in-process watcher make it yield to every other queued/running workflow.
    - cron: '7,37 * * * *'
      timezone: 'Europe/Berlin'
  # A successful main sweep already refreshed the source offers, so rebuild immediately after it.
  workflow_run:
    workflows: ['Twice-daily price fetch']
    types: [completed]
  workflow_dispatch:

# Never put this workflow in the collector's `price-fetch` group. GitHub retains only one pending
# run per concurrency group, so a priority-0 refresh could otherwise replace a queued main sweep.
# Duplicate price-only refreshes may collapse safely; every other workflow keeps priority.
concurrency:
  group: roulette-refresh
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    # A failed/cancelled sweep may contain only part of the horizon. Keep the previous roulette in
    # that case. Manual runs remain available for an explicit owner retry and still obey the lock.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - id: idle-gate
        name: Run only when the entire ETL is idle (priority 0)
        if: github.event_name != 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e "import {githubIsIdle} from './scripts/check-flight-price-feedback.mjs'; import fs from 'node:fs'; const idle=await githubIsIdle({token:process.env.GITHUB_TOKEN,repository:process.env.GITHUB_REPOSITORY,runId:process.env.GITHUB_RUN_ID,ownWorkflowName:'Daily cheapest offers snapshot'}); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'idle='+idle+'\\n');"
      - name: Install dependencies
        if: github.event_name == 'workflow_run' || steps.idle-gate.outputs.idle == 'true'
        run: npm ci
      - name: Revalidate current roulette tickets without rebuilding its pool
        if: github.event_name != 'workflow_run' && steps.idle-gate.outputs.idle == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xpalogebawoljlafsafs.supabase.co' }}
        run: node scripts/refresh-roulette-prices.mjs
      - name: Save daily cheapest real offer per origin
        # Only a completed primary sweep rebuilds the immutable pool. Scheduled priority-0 runs
        # above update exact offer prices only, leaving membership/order/history untouched.
        if: github.event_name == 'workflow_run'
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xpalogebawoljlafsafs.supabase.co' }}
        run: node scripts/snapshot-daily-origin-cheapest.mjs

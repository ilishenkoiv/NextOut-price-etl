name: Daily cheapest offers snapshot

on:
  # Build a new roulette only from a completed main sweep. The main collector can start late
  # and can run for hours, so a wall-clock cron would sometimes publish a half-refreshed pool.
  workflow_run:
    workflows: ['Twice-daily price fetch']
    types: [completed]
  workflow_dispatch:

# Share the collector's repository-wide lock. `workflow_run` normally starts only after the
# triggering sweep has released it; the shared group also makes a manual snapshot wait behind an
# active/delayed sweep and closes the small race with another collector run entering the queue.
concurrency:
  group: price-fetch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    # A failed/cancelled sweep may contain only part of the horizon. Keep the previous roulette in
    # that case. Manual runs remain available for an explicit owner retry and still obey the lock.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Save daily cheapest real offer per origin
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xpalogebawoljlafsafs.supabase.co' }}
        run: node scripts/snapshot-daily-origin-cheapest.mjs

name: Daily cheapest offers snapshot

on:
  schedule:
    # Two daily result epochs: after the full night sweep and after the near-month daytime sweep.
    # Off the top of the hour to reduce GitHub schedule delays.
    - cron: '30 6,14 * * *' # 08:30 and 16:30 Berlin summer
  workflow_dispatch:

concurrency:
  group: daily-origin-cheapest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Save daily cheapest real offer per origin
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xpalogebawoljlafsafs.supabase.co' }}
        run: node scripts/snapshot-daily-origin-cheapest.mjs

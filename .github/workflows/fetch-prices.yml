          path: snapshot-report-m6-6.json
          if-no-files-found: warn
          overwrite: true

  # ── FAR window: months 7–12 ───────────────────────────────────────────────────────────────
  # These six run ONLY on the nightly full sweep (cron '17 23') or a manual far/both run —
  # never on the noon near-only run ('17 10').
  month_7:
    name: month 7
    needs: month_6
    if: >-
      always() &&
      (
        (github.event_name == 'schedule' && github.event.schedule == '17 23 * * *') ||
        github.event.inputs.scope == 'far' ||
        github.event.inputs.scope == 'both'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:

    needs: month_8
    if: >-
      always() &&
      (
        (github.event_name == 'schedule' && github.event.schedule == '17 23 * * *') ||
        github.event.inputs.scope == 'far' ||
        github.event.inputs.scope == 'both'
      )
    runs-on: ubuntu-latest

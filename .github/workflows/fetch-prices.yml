          path: snapshot-report-m12-12.json
          if-no-files-found: warn
          overwrite: true

  # ── The watchdog ────────────────────────────────────────────────────────────────────────────
  # WHY IT EXISTS. Everything the collector does to a snapshot is non-fatal by design: an upload
  # that 400s, a CSV that comes out malformed, a write that exhausts its retries — all of them
  # log and continue, because none of them should cost us a collection. The price of that design
  # is that the RUN goes green regardless, GitHub sends no mail, and the failure is a line in a
  # long log that nobody reads. For four days in July that is exactly what happened: every
  # snapshot was rejected with `Bucket not found` and every run reported success. This job is the
  # one place allowed to go red, so the run's colour finally means something.
  #
  # It is a LEAF. No collector has it in `needs:`, so its verdict cannot skip or cancel any of
  # them — a snapshot that fails validation in one month must not stop the other months collecting.
  watchdog:
    name: watchdog
    needs:
      - month_1
      - month_2
      - month_3
      - month_4
      - month_5
      - month_6
      - month_7
      - month_8
      - month_9
      - month_10
      - month_11
      - month_12
    # always() — the whole point is to report on runs that went wrong, including ones where every
    # collector failed, was cancelled, or never started.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # CONCURRENCY: nothing to add here. The `concurrency` block at the top of this file is
    # WORKFLOW-level, so the group holds one RUN at a time; every job of a run is inside the same
    # group membership and a job cannot queue behind its own run. Giving this job its own
    # `concurrency:` is what WOULD deadlock it — it would then compete with the group it already
    # belongs to. So: no job-level concurrency, no self-block.
    #
    # PERMISSIONS: the workflow-level `contents: read` is enough and is not overridden here.
    # download-artifact authenticates to the artifact service with the runner's own
    # ACTIONS_RUNTIME_TOKEN when it reads artifacts from THIS run, not with GITHUB_TOKEN — the
    # `actions: read` scope and a `github-token:` input are only needed to reach another run or
    # another repository, which this job never does. It also does not check out the repo.
    steps:
      # continue-on-error: download-artifact fails the step outright when the pattern matches
      # nothing (all twelve collectors dead, say). That is a case the watchdog must REPORT, not
      # die on, so the download is allowed to fail and the gate below reads the empty directory.
      - name: Download snapshot reports
        id: reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: snapshot-report-*
          path: reports
          merge-multiple: true

      - name: Summarise the sweep and gate the run
        env:
          # Which jobs were SUPPOSED to run, mirroring the `if:` conditions of the collectors
          # above. Kept as two expressions rather than reading `result == 'skipped'`, because a
          # skip is ambiguous on its own: months 7–12 are skipped BY DESIGN on the noon cron and
          # on a manual near-only run, and failing on that would paint every noon run red once a
          # day. Expected-and-skipped is a fault; not-expected-and-skipped is the schedule
          # working. THESE TWO LINES MUST TRACK THE `if:` BLOCKS ABOVE — if a schedule changes
          # there and not here, the watchdog starts lying in one direction or the other.
          NEAR_EXPECTED: ${{ github.event_name == 'schedule' || github.event.inputs.scope == 'near' || github.event.inputs.scope == 'both' }}
          FAR_EXPECTED: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 23 * * *') || github.event.inputs.scope == 'far' || github.event.inputs.scope == 'both' }}
          R_M1: ${{ needs.month_1.result }}
          R_M2: ${{ needs.month_2.result }}
          R_M3: ${{ needs.month_3.result }}
          R_M4: ${{ needs.month_4.result }}
          R_M5: ${{ needs.month_5.result }}
          R_M6: ${{ needs.month_6.result }}
          R_M7: ${{ needs.month_7.result }}
          R_M8: ${{ needs.month_8.result }}
          R_M9: ${{ needs.month_9.result }}
          R_M10: ${{ needs.month_10.result }}
          R_M11: ${{ needs.month_11.result }}
          R_M12: ${{ needs.month_12.result }}
        run: |
          set -uo pipefail
          fail=0
          reasons=()

          printf '%-13s  %-8s  %-9s  %8s  %-8s  %-8s  %s\n' JOB EXPECTED RESULT ROWS SNAPSHOT UPLOAD DETAIL
          printf '%s\n' '--------------------------------------------------------------------------------------------'

          check() {
            job="$1"; scope="$2"; expected="$3"; result="$4"
            file="reports/snapshot-report-${scope}.json"
            # ASCII placeholders on purpose: printf pads by BYTES, so a multibyte dash here would
            # knock the column alignment out for exactly the rows a reader is scanning.
            rows='-'; snap='-'; up='-'; detail=''

            # A skipped job produced no artifact and cannot be asked for one; anything else ran.
            ran=true
            [ "$result" = 'skipped' ] && ran=false

            if [ "$ran" = true ]; then
              if [ -f "$file" ]; then
                rows=$(jq -r 'if (.rows|type) == "number" then .rows else "?" end' "$file" 2>/dev/null) || rows='?'
                snap=$(jq -r 'if .valid == true then "valid" elif .valid == false then "INVALID" else "?" end' "$file" 2>/dev/null) || snap='?'
                # Anything that is not a literal true lands in UNKNOWN, and that is on purpose:
                # `uploaded: null` (the job never heard back from Storage) and an artifact written
                # by an older collector that has no `uploaded` field at all are the same fact —
                # nobody confirmed the object arrived. Both red. See the gate below.
                up=$(jq -r 'if .uploaded == true then "OK" elif .uploaded == false then "FAILED" else "UNKNOWN" end' "$file" 2>/dev/null) || up='?'
                detail=$(jq -r '(.failures // []) | join(" ; ")' "$file" 2>/dev/null) || detail='unreadable JSON'
                in_scope=$(jq -r '.scope // ""' "$file" 2>/dev/null) || in_scope=''
                if [ -n "$in_scope" ] && [ "$in_scope" != "$scope" ]; then
                  detail="artifact says scope=\"$in_scope\", expected \"$scope\"${detail:+ ; $detail}"
                fi
                if [ "$snap" != 'valid' ]; then
                  fail=1; reasons+=("$job: snapshot not valid ($snap)")
                fi
                # THE HOLE THIS CLOSES. Validation happens before the upload and says nothing
                # about whether the object arrived; the collector's contract keeps a failed upload
                # from failing the job. So a valid CSV that never reached the bucket used to be a
                # green run with nothing in it — exactly the 24-25 July failure, eight snapshots
                # lost, four jobs success. Only a definite true passes here.
                if [ "$up" != 'OK' ]; then
                  fail=1; reasons+=("$job: snapshot upload $up")
                  # A null verdict carries no reason of its own, so give it one — otherwise the
                  # DETAIL column is blank for the single most confusing outcome.
                  if [ "$up" = 'UNKNOWN' ]; then
                    detail="no Storage verdict recorded (uploaded is not true) — the job did not live to hear back${detail:+ ; $detail}"
                  fi
                fi
              else
                snap='MISSING'; up='MISSING'
                detail='no snapshot-report artifact for this job'
                fail=1; reasons+=("$job: artifact missing")
              fi
            fi

            # A job that was supposed to run must have succeeded — skipped and cancelled included.
            if [ "$expected" = 'true' ] && [ "$result" != 'success' ]; then
              fail=1; reasons+=("$job: expected to run, result=$result")
            fi
            # A job that was NOT supposed to run is fine skipped, but if it ran and broke, that
            # is still a broken collector and the run must say so.
            if [ "$expected" != 'true' ] && { [ "$result" = 'failure' ] || [ "$result" = 'cancelled' ]; }; then
              fail=1; reasons+=("$job: not scheduled yet result=$result")
            fi
            # Ran while the schedule said it should not have. Reported, deliberately NOT fatal:
            # the data is collected and written, and the cost is API budget, not correctness.
            if [ "$expected" != 'true' ] && [ "$result" = 'success' ]; then
              detail="ran though not scheduled${detail:+ ; $detail}"
            fi

            printf '%-13s  %-8s  %-9s  %8s  %-8s  %-8s  %s\n' "$job" "$expected" "$result" "$rows" "$snap" "$up" "$detail"
          }

          check 'month 1'  'm1-1'   "$NEAR_EXPECTED" "$R_M1"
          check 'month 2'  'm2-2'   "$NEAR_EXPECTED" "$R_M2"
          check 'month 3'  'm3-3'   "$NEAR_EXPECTED" "$R_M3"
          check 'month 4'  'm4-4'   "$NEAR_EXPECTED" "$R_M4"
          check 'month 5'  'm5-5'   "$NEAR_EXPECTED" "$R_M5"
          check 'month 6'  'm6-6'   "$NEAR_EXPECTED" "$R_M6"
          check 'month 7'  'm7-7'   "$FAR_EXPECTED"  "$R_M7"
          check 'month 8'  'm8-8'   "$FAR_EXPECTED"  "$R_M8"
          check 'month 9'  'm9-9'   "$FAR_EXPECTED"  "$R_M9"
          check 'month 10' 'm10-10' "$FAR_EXPECTED"  "$R_M10"
          check 'month 11' 'm11-11' "$FAR_EXPECTED"  "$R_M11"
          check 'month 12' 'm12-12' "$FAR_EXPECTED"  "$R_M12"

          echo
          if [ "$fail" -eq 0 ]; then
            echo 'WATCHDOG OK — every scheduled job succeeded, every snapshot validated and reached the bucket.'
            exit 0
          fi
          echo "WATCHDOG FAILED — ${#reasons[@]} problem(s):"
          for r in "${reasons[@]}"; do echo "  - $r"; done
          echo
          echo 'The collectors themselves are unaffected: this job only reports. Prices already'
          echo 'written stay written. Grep the collector logs for SNAPSHOT-INVALID and WRITE-LOSS.'
          exit 1

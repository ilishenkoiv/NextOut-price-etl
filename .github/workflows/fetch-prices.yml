name: Twice-daily price fetch

# Collects Travelpayouts prices and writes them to Supabase. Secrets come from
# GitHub → Settings → Secrets and variables → Actions.
#
# WHY THE HORIZON IS SPLIT ONE MONTH PER JOB, AND WHY THE JOBS NEVER RUN IN PARALLEL. Each job
# collects a SINGLE month. This is not for speed — the whole chain takes as long as before, on
# purpose — it is so that every part FINISHES well under its `timeout-minutes` ceiling and gets
# to write its end-of-run summary and upload its snapshot. Three months per job no longer fit
# under the ceiling since the second return window landed (§edge-months): a three-month job is
# cancelled ON the cap before it reaches the summary, so its counters and its snapshot are lost
# and the watchdog sees a hole. One month per job restores that headroom. Running the jobs in
# parallel is NOT an option: they share one token and two streams collide with the upstream rate
# limit, so every job waits for its predecessor via `needs:`, strictly in order.
#
# The horizon length is deliberate. Changing it needs a matching change to `horizonMonths` in
# the app (lib/prices.ts) — without it the user can pick a month nothing is collected for.
# That is a separate, paired change.
#
# WINTER TIME: GitHub Actions cron is UTC and does NOT follow the CET switch. The Berlin times
# noted below assume CEST (summer, UTC+2); in winter (CET, UTC+1) the runs land one hour
# earlier. Adjust in late October if wanted.

on:
  schedule:
    # Avoid :00: GitHub documents start-of-hour load as a source of schedule delays/drops.
    - cron: '17 23 * * *'  # 01:17 Berlin (CEST) — full 12-month sweep, all twelve jobs
    - cron: '17 10 * * *'  # 12:17 Berlin (CEST) — near months 1–6 only (first six jobs)
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which months to collect'
        type: choice
        options: [both, near, far]
        default: both
      # Manual measurement only. Both blank on a normal manual run (and always blank on the
      # cron schedules, which carry no inputs), which the collector reads as "no cap / keep
      # all" — so a scheduled sweep is unchanged. Strings, not numbers: workflow_dispatch
      # inputs have no number type, and the collector parses them itself.
      max_routes:
        description: 'Measurement: cap route-pairs per job (blank = no cap)'
        type: string
        default: ''
      sample:
        description: 'Measurement: keep this fraction of pairs, 0–1 (blank = all)'
        type: string
        default: ''

env:
  # Public project URL (not a secret) — the script also defaults to this.
  SUPABASE_URL: https://xpalogebawoljlafsafs.supabase.co

# Hard guarantee that two RUNS never collect at once. The nightly sweep is long enough that
# it can overrun into the noon start; without this, the two would collect simultaneously and
# double the request rate past the upstream limit. With a single workflow-level concurrency
# group, a new run stays PENDING until the in-progress one finishes.
# cancel-in-progress: false — never abort a run mid-collection (it's writing to Supabase);
# make the newcomer wait instead. (This covers whole runs; the job order WITHIN a run is
# enforced separately by the `needs:` chain.)
concurrency:
  group: price-fetch
  cancel-in-progress: false

# Nothing in this workflow writes to the repo any more: the price snapshot is uploaded to the
# private `price-snapshots` Supabase Storage bucket by the collector itself. Only checkout
# needs the token, and read is enough. Kept EXPLICIT rather than deleted — an absent block
# falls back to the repository default, which may still grant write.
permissions:
  contents: read

jobs:
  # ── NEAR window: months 1–6 ───────────────────────────────────────────────────────────────
  # These six run on BOTH cron schedules (near is refreshed twice daily) and on a manual
  # near/both run. Skipped only for a manual far-only run.
  month_1:
    name: month 1
    # First link in the chain: no predecessor, so no always() needed.
    if: >-
      github.event_name == 'schedule' ||
      github.event.inputs.scope == 'near' ||
      github.event.inputs.scope == 'both'
    runs-on: ubuntu-latest
    # A SINGLE month has ample headroom under this ceiling; it is kept unchanged so the cap
    # still catches a genuinely stuck run.
    timeout-minutes: 180
    env:
      MONTH_START: '1'
      MONTH_COUNT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Node 22 has native WebSocket + fetch. The script also passes a `ws` transport
          # as a belt-and-suspenders fallback, so it works on older Node too.
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Fetch month 1 → Supabase
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Empty on schedule and on an unset manual run → collector reads "no cap / keep all".
          MAX_ROUTES: ${{ inputs.max_routes }}
          SAMPLE_FRACTION: ${{ inputs.sample }}
        run: node scripts/fetch-prices.mjs
      # The job's snapshot verdict, read by the `watchdog` job at the end of the sweep.
      #
      # THIS STEP MUST NOT BE ABLE TO FAIL THE COLLECTOR. A collector that goes red drags nothing
      # else down (every `needs:` below is guarded by `always()`), but it does turn a run that
      # collected and wrote prices into a failure over a 200-byte JSON. Hence all three:
      #   if: always()          — a collector that died mid-run still ships the verdict it reached
      #   continue-on-error     — an upload-artifact outage cannot mark the collector failed
      #   if-no-files-found: warn — no file (job died before writing one) is a warning, not an error
      # The consequence is that a missing artifact is SILENT here, on purpose. Reporting it is the
      # watchdog's job, and it treats an absent artifact as a failure — see that job below.
      #
      # overwrite: true so re-running this job replaces its own earlier artifact instead of
      # colliding with it; the artifact name is per-scope and unique within a run either way.
      # The scope tag is the collector's SCOPE = m<START>-<END>; with COUNT=1 that is m1-1.
      - name: Upload snapshot report (m1-1)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-report-m1-1
          path: snapshot-report-m1-1.json
          if-no-files-found: warn
          overwrite: true

  month_2:
    name: month 2
    # always() lets it run even when its predecessor failed or was skipped; `needs:` only orders.
    needs: month_1
    if: >-
      always() &&
      (
        github.event_name == 'schedule' ||
        github.event.inputs.scope == 'near' ||
        github.event.inputs.scope == 'both'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MONTH_START: '2'
      MONTH_COUNT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Fetch month 2 → Supabase
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAX_ROUTES: ${{ inputs.max_routes }}
          SAMPLE_FRACTION: ${{ inputs.sample }}
        run: node scripts/fetch-prices.mjs
      - name: Upload snapshot report (m2-2)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:

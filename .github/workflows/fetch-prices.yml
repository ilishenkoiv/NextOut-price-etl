          path: snapshot-report-m2-2.json
          if-no-files-found: warn
          overwrite: true

  month_3:
    name: month 3
    needs: month_2
    if: >-
      always() &&
      (
        github.event_name == 'schedule' ||
        github.event.inputs.scope == 'near' ||
        github.event.inputs.scope == 'both'

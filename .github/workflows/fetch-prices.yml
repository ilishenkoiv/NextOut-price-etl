    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MONTH_START: '3'
      MONTH_COUNT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Fetch month 3 → Supabase

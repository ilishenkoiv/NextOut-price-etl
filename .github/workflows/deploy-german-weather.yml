name: Deploy German destination weather

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-german-weather
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Upload and verify German climate rows
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/deploy-expansion-data.mjs --apply --weather-only

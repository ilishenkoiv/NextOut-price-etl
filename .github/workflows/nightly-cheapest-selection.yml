name: Nightly cheapest offers selection

# Manual recovery path only. Scheduled once/day publication is a checkpointed phase inside
# `Sequential data collection`, behind its database lease/fence and shared GitHub lock.
on:
  workflow_dispatch:

# Shared lock with the coordinator and every other data job. queue:max serializes them, so a
# selection can never run in parallel with another selection or with the collector — two
# concurrent selections writing different pools is structurally impossible.
concurrency:
  group: nextout-data-collection
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Select the daily cheapest pool (once per Berlin day; observed_on guarded)
        env:
          SNAPSHOT_EXPANSION_WAVE: ${{ vars.SNAPSHOT_EXPANSION_WAVE || '0' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xpalogebawoljlafsafs.supabase.co' }}
        run: node scripts/snapshot-daily-origin-cheapest.mjs
      - name: Select the shared daily weekend candidates (contract v1)
        env:
          SNAPSHOT_EXPANSION_WAVE: ${{ vars.SNAPSHOT_EXPANSION_WAVE || '0' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xpalogebawoljlafsafs.supabase.co' }}
        run: node scripts/snapshot-daily-window-candidates.mjs

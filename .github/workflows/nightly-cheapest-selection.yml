name: Nightly cheapest offers selection

# The SINGLE selection owner. It (re)builds the immutable roulette pool — membership, order
# and rank — at most once per Berlin day. It issues ZERO Travelpayouts requests: it only reads
# already-collected `offers` and writes `daily_origin_cheapest_pool` / `daily_origin_cheapest`,
# so it is NOT a competing collector. scripts/snapshot-daily-origin-cheapest.mjs additionally
# enforces an observed_on once-per-day guard, so any extra trigger the same day is a safe no-op.
on:
  schedule:
    # Nightly window: ~03:30 Europe/Berlin. Source offers are freshest overnight and the
    # coordinator's overnight session has been running, so the pool is rebuilt on current data.
    - cron: '30 3 * * *'
      timezone: 'Europe/Berlin'
  # Same-day catch-up: every completed coordinator may trigger, but the script refuses Berlin
  # times before 03:30. After 03:30 the atomic publication RPC is once/day, so early 00/02
  # completions cannot publish or block the real nightly selection.
  workflow_run:
    workflows: ['Sequential data collection']
    types: [completed]
  workflow_dispatch:

# Shared lock with the coordinator and every other data job. queue:max serializes them, so a
# selection can never run in parallel with another selection or with the collector — two
# concurrent selections writing different pools is structurally impossible.
concurrency:
  group: nextout-data-collection
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  select:
    # Coordinated mode only. A workflow_run trigger fires only after a SUCCESSFUL coordinator run.
    if: >-
      vars.COLLECTION_MODE == 'coordinated' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Select the daily cheapest pool (once per Berlin day; observed_on guarded)
        env:
          SNAPSHOT_EXPANSION_WAVE: ${{ vars.SNAPSHOT_EXPANSION_WAVE || '0' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xpalogebawoljlafsafs.supabase.co' }}
        run: node scripts/snapshot-daily-origin-cheapest.mjs

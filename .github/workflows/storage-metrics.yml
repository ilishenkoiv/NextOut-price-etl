name: Daily storage metrics

# Appends ONE storage-usage measurement per day to public.storage_metrics: every public table's row
# count + bytes, the whole database size, and the price-snapshots Storage bucket (objects + bytes).
# Old rows are never touched — the table is a history so growth stays visible. The counting is done by
# the SECURITY DEFINER function collect_storage_metrics(); this job just calls it via
# scripts/collect-storage-metrics.mjs. Nothing here is exposed to the app or the anon key.
#
# The table + function are applied by hand (migration 20260820120000_storage_metrics.sql). Until then
# the script no-ops (logs "not applied yet", exits 0), so a run scheduled before the migration lands
# does not turn the workflow red.
#
# Runs after all four daily cleanup slots, before the 02:37 roulette refresh and 03:07 carousel
# collection. Europe/Berlin keeps the order stable through DST changes.
on:
  schedule:
    - cron: '7 2 * * *'
      timezone: 'Europe/Berlin' # 02:07 Berlin daily, after cleanups
  workflow_dispatch: # manual runs are always possible

concurrency:
  group: etl-night-maintenance
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  measure:
    name: Append one storage-usage measurement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce the 00:00–06:00 Berlin maintenance window
        id: night
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hour="$(TZ=Europe/Berlin date +%H)"
          minute="$(TZ=Europe/Berlin date +%M)"
          minute_of_day=$((10#$hour * 60 + 10#$minute))
          busy=0
          for status in in_progress queued; do
            count="$(gh run list --status "$status" --limit 100 --json workflowName --jq '[.[] | select(.workflowName == "Twice-daily price fetch" or .workflowName == "Carousel window prices" or .workflowName == "Daily cheapest offers snapshot")] | length')" || count=1
            busy=$((busy + count))
          done
          if (( minute_of_day < 140 && busy == 0 )); then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping maintenance: Berlin time ${hour}:${minute}; active/queued collectors: ${busy}."
          fi

      - name: Checkout
        if: steps.night.outputs.allowed == 'true'
        uses: actions/checkout@v7

      - name: Setup Node
        if: steps.night.outputs.allowed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.night.outputs.allowed == 'true'
        run: npm ci

      - name: Measure storage usage and append a row
        if: steps.night.outputs.allowed == 'true'
        # Same secret every other job uses — the service-role key. It is the ONLY way to execute the
        # collector function and read/write the closed table. SUPABASE_URL is public (not a secret).
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xpalogebawoljlafsafs.supabase.co' }}
        run: node scripts/collect-storage-metrics.mjs

name: Probe market and week calendar

# ⚠️ TEMPORARY ONE-OFF PROBE — delete after use.
# Read-only diagnostic: makes partner requests for MUC→BCN on the fixed break window
# 2026-08-28 → 2026-08-30 and prints each answer to the log. It NEVER touches the database
# — no Supabase client, no writes. Manual dispatch only, no schedule.
#
# TWO methods, each tried under SIX market settings (the partner has no "de"/"ch" market;
# the closed list of relevant codes is at/us/it/es/nl, plus the no-parameter default):
#   A) prices_for_dates — the CURRENT method, exactly as the window collector sends it
#      (exact dates, direct=false / any-stops variant).
#   B) week-matrix — the weekly calendar around the dates.
#   markets: (none) · at · us · it · es · nl   → 2 × 6 = 12 requests total.
#
# For each: the full request URL WITHOUT the token, the HTTP code, how many records came back,
# and the records themselves in full (or "EMPTY" when none). The token comes from the SAME
# secret as the main collection (secrets.TP_TOKEN) and is never printed.
on:
  workflow_dispatch: {}

concurrency:
  group: probe-market-week
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe requests (MUC→BCN, 2026-08-28 → 2026-08-30)
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
        run: |
          set -uo pipefail

          probe () {
            local label="$1"; local shown="$2"; local url="$3"
            echo "==================================================================="
            echo "### ${label}"
            echo "URL: ${shown}"
            local code
            code=$(curl -s --max-time 30 -o resp.json -w "%{http_code}" "${url}")
            echo "HTTP: ${code}"
            node -e '
              let raw = require("fs").readFileSync("resp.json", "utf8");
              let d;
              try { d = JSON.parse(raw); }
              catch (e) { console.log("BODY (not JSON):"); console.log(raw); process.exit(0); }
              const data = d.data;
              let n = Array.isArray(data) ? data.length
                    : (data && typeof data === "object" ? Object.keys(data).length : 0);
              console.log("success:", d.success);
              console.log("records:", n);
              if (!data || n === 0) { console.log("EMPTY — no records"); }
              else { console.log("RECORDS:"); console.log(JSON.stringify(data, null, 2)); }
              if (d.error) console.log("error:", JSON.stringify(d.error));
            '
            echo
          }

          # Try one method under every market setting: (none) then the closed list at/us/it/es/nl.
          run_method () {
            local method_label="$1"; local base="$2"
            local mkt
            for mkt in "" at us it es nl; do
              if [ -z "${mkt}" ]; then
                probe "${method_label} — no market" "${base}&token=***" "${base}&token=${TP_TOKEN}"
              else
                probe "${method_label} — market=${mkt}" "${base}&market=${mkt}&token=***" "${base}&market=${mkt}&token=${TP_TOKEN}"
              fi
            done
          }

          PFD="https://api.travelpayouts.com/aviasales/v3/prices_for_dates?origin=MUC&destination=BCN&departure_at=2026-08-28&return_at=2026-08-30&direct=false&currency=eur&limit=500"
          WK="https://api.travelpayouts.com/v2/prices/week-matrix?origin=MUC&destination=BCN&depart_date=2026-08-28&return_date=2026-08-30&currency=eur&show_to_affiliates=true"

          run_method "A) prices_for_dates — current method" "${PFD}"
          run_method "B) week-matrix — weekly calendar"     "${WK}"

          rm -f resp.json
          echo "Done — 12 probe requests made (2 methods × 6 markets), nothing written to any database."

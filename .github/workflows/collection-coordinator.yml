name: Sequential data collection
on:
  workflow_dispatch:
    inputs:
      rollout_action:
        description: 'Owner-authorized rollout control (manual only)'
        type: choice
        options: [none, probe, backup, restore]
        default: none
      validate_only:
        description: 'Read-only schema/bucket validation; no collection'
        type: boolean
        default: true
      smoke_minutes:
        description: 'Manual bounded collection duration; ignored by schedules'
        type: string
        default: '15'
      trigger_source:
        description: 'Dispatch provenance only; does not change collection behavior'
        type: choice
        options: [manual, supabase-cron]
        default: manual
concurrency:
  group: nextout-data-collection
  queue: max
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  collect:
    if: vars.COLLECTION_MODE == 'coordinated' || (github.event_name == 'workflow_dispatch' && inputs.rollout_action == 'none')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record trigger provenance
        if: github.event_name == 'workflow_dispatch'
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'manual' }}
        run: echo "Collection trigger source=${TRIGGER_SOURCE}"
      - uses: actions/checkout@v7
        if: inputs.trigger_source != 'supabase-cron' || vars.COLLECTION_MODE == 'coordinated'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: inputs.trigger_source != 'supabase-cron' || vars.COLLECTION_MODE == 'coordinated'
        with:
          node-version: '22'
          cache: npm
      - if: inputs.trigger_source != 'supabase-cron' || vars.COLLECTION_MODE == 'coordinated'
        run: npm ci
      - name: Verify applied SQL without writing data
        if: github.event_name == 'workflow_dispatch' && inputs.trigger_source != 'supabase-cron' && inputs.rollout_action == 'none' && inputs.validate_only
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xpalogebawoljlafsafs.supabase.co' }}
        run: node scripts/check-collection-ready.mjs
      - name: Resume one sequential collector
        if: >-
          github.event_name != 'workflow_dispatch' ||
          (inputs.rollout_action == 'none' &&
            ((inputs.trigger_source == 'supabase-cron' && vars.COLLECTION_MODE == 'coordinated') ||
             (inputs.trigger_source != 'supabase-cron' && !inputs.validate_only)))
        env:
          COLLECTION_MODE: ${{ inputs.trigger_source == 'supabase-cron' && vars.COLLECTION_MODE || (github.event_name == 'workflow_dispatch' && 'coordinated' || vars.COLLECTION_MODE) }}
          COLLECTION_SESSION_MINUTES: ${{ inputs.trigger_source == 'supabase-cron' && '25' || (github.event_name == 'workflow_dispatch' && inputs.smoke_minutes || '25') }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          COLLECTION_TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
          EXPANSION_WAVE: ${{ vars.EXPANSION_WAVE || '0' }}
          SNAPSHOT_EXPANSION_WAVE: ${{ vars.SNAPSHOT_EXPANSION_WAVE || '0' }}
          GUARANTEE_DAILY_MAIN: ${{ vars.GUARANTEE_DAILY_MAIN || 'false' }}
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xpalogebawoljlafsafs.supabase.co' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/run-collection.mjs
  rollout-control:
    if: github.event_name == 'workflow_dispatch' && inputs.rollout_action != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Production baseline / backup control
        env:
          ROLLOUT_ACTION: ${{ inputs.rollout_action }}
          ROLLOUT_RUN_ID: ${{ github.run_id }}
          BACKUP_PREFIX: rollout-backups/2026-09-22T10-07-21-570Z-35714198385
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xpalogebawoljlafsafs.supabase.co' }}
        run: node scripts/production-rollout-control.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: etl-rollout-${{ inputs.rollout_action }}-${{ github.run_id }}
          path: rollout-output/**
          if-no-files-found: error
          retention-days: ${{ inputs.rollout_action == 'probe' && 7 || 30 }}

name: Daily window_prices cleanup

# Deletes carousel window fares from public.window_prices once their DEPARTURE has passed
# (departure_at < today, Europe/Berlin) — a window that has already left can never be shown again.
# Future and today's windows are never touched. This is its OWN workflow — deliberately NOT folded
# into the window sweep (fetch-window-prices.yml) or the main collector (fetch-prices.yml): each
# writes flight data under load, this only prunes past-dated rows, and keeping them apart means
# neither can delay or break the other.
#
# The table may not exist yet (its migration is applied by hand, separately). The script treats a
# missing table as a clean no-op — it logs that the table is absent and exits 0, so a run scheduled
# before the table lands does not turn the workflow red.
#
# NO new migration is needed: 20260810120000_window_prices.sql already grants service_role DELETE
# on the table (same key this job uses).
#
# Scheduled maintenance is restricted to 00:00–06:00 Europe/Berlin. The runtime gate below catches
# delayed GitHub schedules and daytime manual dispatches. Maintenance is serialized, and the gate
# refuses to start while either price collector or the roulette refresh is active/queued.
on:
  schedule:
    - cron: '22 1 * * *'
      timezone: 'Europe/Berlin' # 01:22 Berlin daily
  workflow_dispatch: # manual runs are always possible

concurrency:
  group: etl-night-maintenance
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  cleanup:
    name: Delete window_prices rows with a past departure date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce the 00:00–06:00 Berlin maintenance window
        id: night
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hour="$(TZ=Europe/Berlin date +%H)"
          minute="$(TZ=Europe/Berlin date +%M)"
          minute_of_day=$((10#$hour * 60 + 10#$minute))
          busy=0
          for status in in_progress queued; do
            count="$(gh run list --status "$status" --limit 100 --json workflowName --jq '[.[] | select(.workflowName == "Twice-daily price fetch" or .workflowName == "Carousel window prices" or .workflowName == "Daily cheapest offers snapshot")] | length')" || count=1
            busy=$((busy + count))
          done
          if (( minute_of_day < 140 && busy == 0 )); then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping maintenance: Berlin time ${hour}:${minute}; active/queued collectors: ${busy}."
          fi

      - name: Checkout
        if: steps.night.outputs.allowed == 'true'
        uses: actions/checkout@v7

      - name: Setup Node
        if: steps.night.outputs.allowed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.night.outputs.allowed == 'true'
        run: npm ci

      - name: Delete window_prices rows whose departure has passed
        if: steps.night.outputs.allowed == 'true'
        # Same secret the collectors use — the service-role key deletes past RLS.
        # SUPABASE_URL passed alongside it (public, not a secret); default = the value used now.
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://xpalogebawoljlafsafs.supabase.co' }}
        run: node scripts/cleanup-window-prices.mjs
